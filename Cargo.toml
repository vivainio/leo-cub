[package]
name = "leo-cub"
version = "0.0.0-dev"
edition = "2024"
description = "Automation-safe library and CLI for Leo outline files"
authors = ["Ville Vainio <vivainio@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivainio/leo-cub"
readme = "README.md"
keywords = ["leo-editor", "outline", "cli", "tui"]
categories = ["command-line-utilities", "text-editors"]

[lib]
name = "leo"

[[bin]]
name = "cub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
crossterm = { version = "0.29.0", optional = true }
quick-xml = "0.41"
ratatui = { version = "0.30.0", optional = true }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
thiserror = "2.0"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"

[features]
default = ["tui", "syntax"]
tui = ["dep:ratatui", "dep:crossterm"]
syntax = ["dep:syntect"]
