[package]
name = "leo-cub"
version = "0.0.0-dev"
edition = "2024"
description = "Automation-safe library and CLI for Leo outline files"
authors = ["Ville Vainio <vivainio@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivainio/leo-cub"
readme = "README.md"
keywords = ["leo-editor", "outline", "cli", "tui"]
categories = ["command-line-utilities", "text-editors"]

[lib]
name = "leo"

[[bin]]
name = "cub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
crossterm = { version = "0.29.0", optional = true, features = ["osc52"] }
quick-xml = "0.41"
ratatui = { version = "0.30.0", optional = true, features = ["unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.2", optional = true }
rayon = "1.10"
regex = "1.13"
rhai = { version = "1", optional = true }
rhai-fs = { version = "0.1.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.3.2"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tui-input = { version = "0.15.4", optional = true }

[features]
default = ["tui", "syntax"]
tui = ["dep:ratatui", "dep:ratatui-textarea", "dep:crossterm", "dep:tui-input", "rhai"]
# Embedded Rhai scripting: `@action` bodies (tui feature) and the
# standalone `cub run` test-script command.
rhai = ["dep:rhai", "dep:rhai-fs"]
syntax = ["dep:syntect"]
