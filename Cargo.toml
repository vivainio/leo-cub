[package]
name = "leo-rs"
version = "0.1.0"
edition = "2024"
description = "Automation-safe library and CLI for Leo outline files"
license = "MIT OR Apache-2.0"

[lib]
name = "leo"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
quick-xml = "0.41"
ratatui = { version = "0.30.0", optional = true }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
